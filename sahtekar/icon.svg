<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2478"/>
      <stop offset="1" stop-color="#120c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#9a6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff86b8"/>
      <stop offset="1" stop-color="#e03582"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#ffe2bd"/>
    </linearGradient>
    <clipPath id="fc"><circle cx="256" cy="270" r="178"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- sparkles -->
  <path d="M410 96l9 24 24 9-24 9-9 24-9-24-24-9 24-9z" fill="#ffd84a"/>
  <path d="M96 392l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#ffd84a" opacity="0.85"/>
  <!-- face -->
  <circle cx="256" cy="270" r="178" fill="url(#face)"/>
  <!-- cheeks -->
  <circle cx="132" cy="318" r="22" fill="#ff9fc0" opacity="0.55"/>
  <circle cx="380" cy="318" r="22" fill="#ff9fc0" opacity="0.55"/>
  <!-- domino mask -->
  <path clip-path="url(#fc)" d="M70 236c0-44 64-62 118-34 26 14 110 14 136 0 54-28 118-10 118 34 0 62-54 96-108 74-30-12-44-34-64-34s-34 22-64 34c-54 22-108-12-108-74z" fill="url(#mask)"/>
  <!-- eye holes -->
  <ellipse cx="172" cy="252" rx="44" ry="34" fill="#fff6e6"/>
  <ellipse cx="340" cy="252" rx="44" ry="34" fill="#fff6e6"/>
  <!-- pupils: a sideways glance -->
  <circle cx="188" cy="256" r="18" fill="#1b1433"/>
  <circle cx="356" cy="256" r="18" fill="#1b1433"/>
  <circle cx="194" cy="249" r="6" fill="#fff"/>
  <circle cx="362" cy="249" r="6" fill="#fff"/>
  <!-- one raised eyebrow -->
  <path d="M296 188q38-22 78-4" stroke="#1b1433" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- sly smile -->
  <path d="M176 378q80 62 170-10" stroke="#1b1433" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M340 366l24-18" stroke="#1b1433" stroke-width="14" fill="none" stroke-linecap="round"/>
</svg>
