<!doctype html>
<html lang="tr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <script>
      // Touch tablets (iPad, Android tablets): render everything larger instead of a small phone column.
      // Only initial-scale is set, so the layout viewport becomes window width / scale (no sideways panning).
      // The scale follows the WINDOW, not the screen: Split View, Slide Over and Stage Manager windows can be
      // phone-narrow, and the layout must stay at least 420 px wide. Recomputed when the window changes size.
      (function () {
        try {
          var meta = document.querySelector('meta[name=viewport]');
          var phone = meta.getAttribute('content');
          var cur = 1;
          var m = Math.min(screen.width, screen.height);
          if (!(navigator.maxTouchPoints > 0 && m >= 740)) return;
          var max = m >= 1000 ? 1.35 : 1.25;
          var fit = function () {
            var w = window.innerWidth * cur; // the window width at scale 1, whatever the current scale
            var z = Math.min(max, w / 420);
            z = z < 1.05 ? 1 : Math.round(z * 100) / 100;
            if (Math.abs(z - cur) < 0.02) return;
            cur = z;
            meta.setAttribute('content', z === 1 ? phone : 'initial-scale=' + z + ', minimum-scale=' + z + ', maximum-scale=' + z + ', user-scalable=no, viewport-fit=cover');
            document.documentElement.classList.toggle('tablet', z > 1);
          };
          fit();
          var t;
          window.addEventListener('resize', function () {
            clearTimeout(t);
            t = setTimeout(fit, 150);
          });
        } catch (e) {}
      })();
    </script>
