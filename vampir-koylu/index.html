    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <script>
      // Touch tablets (iPad, Android tablets): render everything larger instead of a small phone column.
      // Only initial-scale is set, so the layout viewport becomes device-width / scale (no sideways panning).
      (function () {
        try {
          var m = Math.min(screen.width, screen.height);
          if (navigator.maxTouchPoints > 0 && m >= 740) {
            var z = m >= 1000 ? 1.35 : 1.25;
            document.querySelector('meta[name=viewport]').setAttribute('content', 'initial-scale=' + z + ', minimum-scale=' + z + ', maximum-scale=' + z + ', user-scalable=no, viewport-fit=cover');
            document.documentElement.classList.add('tablet');
          }
        } catch (e) {}
      })();
    </script>
